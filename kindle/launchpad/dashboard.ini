;; Dashboard hotkeys (Launchpad). Press Shift, release, then the letters.
[Actions]
;; Shift D D: start the dashboard
D D = !sh /mnt/us/dashboard/dashboard.sh start &
;; Shift D X: stop the dashboard and bring back the normal Kindle UI
D X = !sh /mnt/us/dashboard/dashboard.sh stop &
;; Shift D R: redraw now with a full refresh
D R = !sh /mnt/us/dashboard/dashboard.sh refresh &
;; Shift D A: toggle starting the dashboard automatically at boot
D A = !sh -c 'if [ -f /mnt/us/dashboard/AUTOSTART ]; then rm /mnt/us/dashboard/AUTOSTART; eips 1 38 "Dashboard autostart OFF"; else touch /mnt/us/dashboard/AUTOSTART; eips 1 38 "Dashboard autostart ON "; fi' &
;; Shift D I: write diagnostics (input devices, raw key events) to dashboard/diag.txt
D I = !sh /mnt/us/dashboard/diag.sh &

# Kindle dashboard settings. Edit this file over USB (it lives at
# dashboard/dashboard.conf on the Kindle drive), then restart the dashboard
# (Shift D X, then Shift D D) or reboot.

# Address of the PC running `kindle-dash serve`.
SERVER_IP=192.168.1.100
SERVER_PORT=8080
# Or set the whole URL directly (overrides the two lines above):
#SERVER_URL=http://192.168.1.100:8080/dashboard.png

# Seconds between refreshes. 60 keeps the clock exact (refresh lands right
# after each minute boundary). Use 300+ when running on battery.
INTERVAL=60

# Do a full black/white flash every N refreshes to clear e-ink ghosting.
FULL_REFRESH_EVERY=30

# Stop the Kindle UI while the dashboard runs so it can't draw over it
# (status bar, menus). "Shift D X" stops the dashboard and restarts the UI.
STOP_FRAMEWORK=yes

# Seconds to wait for a download before giving up.
FETCH_TIMEOUT=30

# Buttons that switch screens (Linux key codes on the Kindle Keyboard):
# 191 = right Next Page, 104 = left Next Page, 106 = 5-way right,
# 193 = left Prev Page, 105 = 5-way left.
NEXT_KEYS="191 104 106"
PREV_KEYS="193 105"
KEY_DEVICES="/dev/input/event0 /dev/input/event1"
# Log every key press to dashboard/dashboard.log (to find codes of other buttons)
DEBUG_KEYS=no

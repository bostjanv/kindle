[package]
name = "kindle-dash"
version = "0.2.0"
edition = "2024"
description = "Renders an e-ink dashboard PNG (clock, weather, calendar, xkcd) for a jailbroken Kindle"

[dependencies]
ab_glyph = "0.2.32"
anyhow = "1.0.105"
chrono = "0.4.45"
chrono-tz = "0.10.4"
clap = { version = "4.6.10", features = ["derive"] }
env_logger = "0.11.12"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif"] }
log = "0.4.35"
rand = "0.10.4"
rrule = "0.14.0"
serde_json = "1.0.154"
tiny-skia = "0.12.0"
tiny_http = "0.12.0"
toml = "1.2.3"
ureq = { version = "3.5.2", features = ["json"] }

[profile.release]
strip = true

[project]
name = "kindle-dash"
version = "0.1.0"
description = "Renders an e-ink dashboard PNG (clock, weather, calendar) for a jailbroken Kindle"
requires-python = ">=3.11"
dependencies = [
    "pillow>=10.1",
    "requests>=2.31",
    "icalendar>=5.0",
    "recurring-ical-events>=2.1",
    "tzdata",
    "remind>=0.19",   # rem2ics, for Remind sources (also needs the `remind` program)
]

[project.scripts]
kindle-dash = "kindle_dash.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kindle_dash*"]

[tool.setuptools.package-data]
kindle_dash = ["fonts/*"]
